<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>HomeHub — Coming Soon</title>

  <style>
    /* =========================
       RESET
    ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;

      overflow: hidden;

      background: #05050d;

      /* Prevent selecting anything */
      user-select: none;
      -webkit-user-select: none;

      /* Prevent touch dragging/scrolling */
      touch-action: none;
    }

    /* =========================
       FULL SCREEN PAGE
    ========================= */

    body {
      position: fixed;

      inset: 0;

      width: 100vw;
      height: 100vh;
      height: 100dvh;

      overflow: hidden;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      position: fixed;

      inset: 0;

      width: 100vw;
      height: 100vh;
      height: 100dvh;

      overflow: hidden;

      background: #05050d;
    }

    /* =========================
       HERO IMAGE
    ========================= */

    .hero img {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      /*
        COVER = completely fills
        the browser window.

        This removes the black bars
        you were seeing.
      */
      object-fit: cover;

      /*
        Keeps the iPad centered.
      */
      object-position: center center;

      display: block;

      /* Disable image dragging */
      -webkit-user-drag: none;
      user-drag: none;

      /* Disable selecting */
      user-select: none;
      -webkit-user-select: none;

      /* Disable interaction */
      pointer-events: none;

      /* Disable touch gestures */
      touch-action: none;
    }

    /* =========================
       EXTRA LARGE SCREENS
    ========================= */

    @media (min-width: 1800px) {
      .hero img {
        object-position: center center;
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {
      .hero img {
        object-fit: cover;
        object-position: center center;
      }
    }

    /* =========================
       REDUCED MOTION
    ========================= */

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <main class="hero">
    <img
      src="assets/homehub-hero.png"
      alt="HomeHub — Turn an old iPad into a new device"
      draggable="false"
    >
  </main>

  <script>
    /*
      Prevent dragging the image.
    */
    document.addEventListener("dragstart", function (event) {
      event.preventDefault();
    });

    /*
      Prevent selecting the image/page.
    */
    document.addEventListener("selectstart", function (event) {
      event.preventDefault();
    });

    /*
      Prevent image dragging with mouse.
    */
    document.addEventListener("mousedown", function (event) {
      if (event.target.tagName === "IMG") {
        event.preventDefault();
      }
    });

    /*
      Prevent touch scrolling/dragging.
    */
    document.addEventListener(
      "touchmove",
      function (event) {
        event.preventDefault();
      },
      { passive: false }
    );

    /*
      Prevent the image from being dragged
      with a long press on mobile.
    */
    document.addEventListener("contextmenu", function (event) {
      event.preventDefault();
    });
  </script>

</body>
</html>
